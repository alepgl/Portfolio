<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Alessandro Pagliara</title>

  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="Index-style.css">
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
  
  <style>
    html {
      scroll-behavior: smooth;
    }
  </style>
</head>

<body>

  <div id="page-transition"></div>

  <header class="header">
    <h1>#AP</h1>
    <nav class="menu">
      <ul>
        <li><a href="about.html" onclick="handleClick(event)">about</a></li>
        <li><a href="work.html" onclick="handleClick(event)">work</a></li>
        <li><a href="social.html" onclick="handleClick(event)">social</a></li>
      </ul>
    </nav>
  </header>

  <div class="hero">
    <div class="hero__img">
      <img src="multimedia/1.svg" alt="disegnoale">
    </div>
    <div class="hero__text">
      <h1>Hello.</h1>
      <p>I'm Alessandro Pagliara and I'm a "Graphic designer"</p>
    </div>
  </div>

  <div class="arrow-container">
    <p class="scroll-text">scroll down</p>
    <div class="arrow"></div>
  </div>

  <div class="Last-Title" data-aos="fade-up">
    <h1>Do you want to start </br>a project together?</h1>
  </div>

  <div class="email-card-container">
    <a href="mailto:pagliaraalessandro15@gmail.com" class="email-card">
      pagliaraalessandro15@gmail.com
    </a>
  </div>

  <script>
    document.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', event => {
        const href = link.getAttribute('href');

        if (href && href !== '#' && !href.startsWith('javascript')) {
          event.preventDefault();

          const transitionElement = document.getElementById('page-transition');
          transitionElement.classList.add('active');

          setTimeout(() => {
            window.location.href = href;
          }, 800);
        }
      });
    });

    window.addEventListener('load', () => {
      const transitionElement = document.getElementById('page-transition');
      transitionElement.classList.add('slideOut');

      setTimeout(() => {
        transitionElement.classList.remove('slideOut');
      }, 800);
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      AOS.init({
        duration: 1000,
        easing: 'ease',
        once: true
      });
    });
  </script>

</body>
</html>
